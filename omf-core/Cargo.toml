[package]
name = "omf-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo de OMF: modelo de documento, línea de tiempo, render vectorial y exportador SWF"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd", "png-format"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
i_overlay = "9.0.1"
miniz_oxide = "0.8"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
